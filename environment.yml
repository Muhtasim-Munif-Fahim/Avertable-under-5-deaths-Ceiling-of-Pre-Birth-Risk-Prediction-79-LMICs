name: global-cm-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Core data
  - numpy=2.3.1
  - pandas=2.3.1
  - pyarrow=21.0.0
  # Statistics / modelling
  - scipy=1.15.3
  - statsmodels=0.14.5
  - scikit-learn=1.5.2
  # ML
  - xgboost=2.1.3
  - lightgbm>=4.0.0
  - shap=0.49.1
  - optuna=4.6.0
  # Visualisation
  - matplotlib=3.10.3
  - seaborn>=0.12.0
  # Misc
  - tqdm>=4.65.0
  - requests=2.32.5
  - pip
  - pip:
    - pyreadstat==1.3.2
    - wbgapi==1.0.12